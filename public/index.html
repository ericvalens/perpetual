    <main class="stage">
      <wrist-watch class="viewport" aria-label="Watch">
        <p class="nogl" hidden>This watch needs WebGL, which this browser has turned off.</p>
      </wrist-watch>
      <div class="hint">
        <watch-crown class="crown" aria-label="Crown">
          <span class="crown-icon" aria-hidden="true"></span>
          <span class="crown-pos" aria-hidden="true"><span data-pos="wind">Wind</span><span data-pos="date">Date</span><span data-pos="time">Time</span></span>
        </watch-crown>
        <p>
          <span class="touch">Drag to spin it. Tap the crown to pull it out, then drag it up or down to turn it.</span>
          <span class="keys">Tab to the crown · ⏎ pull it out · ↑ ↓ turn it</span>
        </p>
      </div>
    </main>
  </body>
